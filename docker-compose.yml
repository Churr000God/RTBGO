# docker-compose.yml
#
# Levanta la base de datos del subsistema de Tiempo. `db/ddl/*.sql` corre solo,
# en orden alfabético, la primera vez que se crea el volumen `db_data`
# (00_esquemas → 01_persona_stub → 02_tiempo → 03_parametros_ejemplo).
#
# `db/indices/01_indices.sql` NO se monta aquí: el README lo corre como paso
# aparte, después del generador de datos sintéticos.
#
# Los servicios de backend y frontend se agregan cuando exista código que
# correr (ver AGENTS.md).
#
# Uso:
#   docker compose up -d db
#   docker compose exec db psql -U $POSTGRES_USER -d $POSTGRES_DB

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scj_dev}
      POSTGRES_DB: ${POSTGRES_DB:-scj}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scj} -d ${POSTGRES_DB:-scj}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
